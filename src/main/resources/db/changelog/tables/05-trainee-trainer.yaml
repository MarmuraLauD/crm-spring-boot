databaseChangeLog:
  - changeSet:
      id: 05-create-trainee-trainer-table
      author: developer
      changes:
        - createTable:
            tableName: trainee_trainer
            columns:
              - column:
                  name: trainee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tt_trainee
                    references: trainees(user_id)
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tt_trainer
                    references: trainers(user_id)
        - addPrimaryKey:
            tableName: trainee_trainer
            columnNames: trainee_id, trainer_id
            constraintName: pk_trainee_trainer