databaseChangeLog:
  - changeSet:
      id: 06-create-trainings-table
      author: developer
      changes:
        - createTable:
            tableName: trainings
            columns:
              - column:
                  name: training_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: training_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: training_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: training_duration
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: training_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trainings_type
                    references: training_types(training_type_id)
              - column:
                  name: trainee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trainings_trainee
                    references: trainees(user_id)
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trainings_trainer
                    references: trainers(user_id)