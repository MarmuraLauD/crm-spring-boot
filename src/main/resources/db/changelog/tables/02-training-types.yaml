databaseChangeLog:
  - changeSet:
      id: 02-create-training-types-table
      author: developer
      changes:
        - createTable:
            tableName: training_types
            columns:
              - column:
                  name: training_type_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: training_type_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true