databaseChangeLog:
  - changeSet:
      id: 03-create-trainers-table
      author: developer
      changes:
        - createTable:
            tableName: trainers
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_trainers_users
                    references: users(user_id)
              - column:
                  name: specialization_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_trainers_specialization
                    references: training_types(training_type_id)