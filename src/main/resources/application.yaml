spring:
  db:
    url: jdbc:postgresql://localhost:5432/gym_crm
    username: postgres
    password: ${DB_PASSWORD}
    driver: org.postgresql.Driver
    pool:
      size: 10

  hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
    show_sql: true
    format_sql: true
    hbm2ddl:
      auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml